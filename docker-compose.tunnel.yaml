name: dashly
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: lklynet/dashly:latest
    container_name: dashly-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dashly-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      NGINX_DB_PATH: /data/sqlite/dashly.sqlite
    volumes:
      - './volumes/data/dashly:/data:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://dashly-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - dashly
      - cloudflare


networks:
  dashly:
    name: dashly
    external: false
  cloudflare:
    external: true
