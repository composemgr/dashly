# nginx proxy address - http://172.17.0.1:64150

name: dashly
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: lklynet/dashly:latest
    container_name: dashly-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dashly-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      NGINX_DB_PATH: /data/sqlite/dashly.sqlite
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64150:8080'
    volumes:
      - './volumes/data/dashly:/data:z'
    networks:
      - dashly

networks:
  dashly:
    name: dashly
    external: false
